<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="初中三年+高考高频核心词汇背单词应用，支持闪卡记忆、选择题测验、拼写测试，离线可用">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="词汇速记">
  <meta name="mobile-web-app-capable" content="yes">
  <title>中考+高考核心词汇 - 背单词神器</title>
  <link rel="stylesheet" href="style.css?v=8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
  <div class="app">
    <!-- 顶部头部 -->
    <header class="header">
      <div class="header-top">
        <div class="logo">
          <span class="logo-icon">📚</span>
          <div>
            <h1 class="logo-title">核心词汇速记</h1>
            <p class="logo-sub">初中 + 高考 · 六年词汇</p>
          </div>
        </div>
        <div class="header-stats" id="headerStats">
          <div class="stat-pill">
            <span class="stat-num" id="learnedCount">0</span>
            <span class="stat-label">已学</span>
          </div>
          <div class="stat-pill">
            <span class="stat-num" id="masteredCount">0</span>
            <span class="stat-label">已掌握</span>
          </div>
          <div class="stat-pill">
            <span class="stat-num" id="totalCount">0</span>
            <span class="stat-label">总词数</span>
          </div>
        </div>
      </div>

      <!-- 年级筛选 -->
      <div class="filter-bar">
        <div class="grade-tabs">
          <button class="grade-btn active" data-grade="all">全部</button>
          <button class="grade-btn" data-grade="junior">初中</button>
          <button class="grade-btn" data-grade="senior">高中</button>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索单词或释义...">
        </div>
      </div>
    </header>

    <!-- 主导航 -->
    <nav class="main-nav">
      <button class="nav-btn active" data-view="list">
        <span class="nav-icon">📖</span>
        <span>单词本</span>
      </button>
      <button class="nav-btn" data-view="flashcard">
        <span class="nav-icon">🎴</span>
        <span>闪卡</span>
      </button>
      <button class="nav-btn" data-view="quiz">
        <span class="nav-icon">✏️</span>
        <span>选择题</span>
      </button>
      <button class="nav-btn" data-view="spell">
        <span class="nav-icon">⌨️</span>
        <span>拼写</span>
      </button>
      <button class="nav-btn" data-view="stats">
        <span class="nav-icon">📊</span>
        <span>统计</span>
      </button>
    </nav>

    <!-- 内容区域 -->
    <main class="content">
      <!-- 单词列表视图 -->
      <section class="view view-list active" id="view-list">
        <div class="list-toolbar">
          <div class="list-filter-tabs">
            <button class="filter-tab active" data-filter="unlearned">未学</button>
            <button class="filter-tab" data-filter="learned">已学</button>
            <button class="filter-tab" data-filter="mastered">已掌握</button>
          </div>
          <span class="result-count" id="resultCount">共 0 个单词</span>
          <div class="list-actions">
            <button class="btn-text" id="markAllLearnedBtn">标记全部为已学</button>
            <button class="btn-text danger" id="resetLearnedBtn">重置进度</button>
          </div>
        </div>
        <div class="word-grid" id="wordGrid"></div>
      </section>

      <!-- 闪卡视图 -->
      <section class="view view-flashcard" id="view-flashcard">
        <div class="flashcard-wrap">
          <div class="flashcard-progress">
            <span id="flashMode" class="flash-mode"></span>
            <span id="flashIndex">1</span> / <span id="flashTotal">10</span>
          </div>
          <div class="flashcard" id="flashcard">
            <div class="flashcard-inner">
              <div class="flashcard-front">
                <div class="card-grade" id="flashGrade"></div>
                <h2 class="card-word" id="flashWord"></h2>
                <button class="speak-btn speak-btn-card" id="flashSpeakFront" title="朗读单词">🔊 朗读</button>
                <p class="card-phonetic" id="flashPhonetic"></p>
                <p class="card-pos" id="flashPos"></p>
                <div class="card-hint" id="flashHint">点击卡片查看释义</div>
              </div>
              <div class="flashcard-back">
                <h2 class="card-word" id="flashWordBack"></h2>
                <button class="speak-btn speak-btn-card" id="flashSpeakBack" title="朗读单词">🔊 朗读</button>
                <p class="card-meaning" id="flashMeaning"></p>
                <div class="card-example">
                  <p class="example-en" id="flashExample"></p>
                  <p class="example-cn" id="flashTrans"></p>
                </div>
                <div class="card-tags" id="flashTags"></div>
              </div>
            </div>
          </div>
          <div class="flashcard-controls">
            <button class="btn-circle" id="flashPrev" title="上一个">‹</button>
            <button class="btn-circle btn-remember" id="flashUnfamiliar" title="不熟">不熟</button>
            <button class="btn-circle btn-flip" id="flashFlip" title="翻转">翻</button>
            <button class="btn-circle btn-known" id="flashKnown" title="认识">认识</button>
            <button class="btn-circle" id="flashNext" title="下一个">›</button>
          </div>
          <div class="flashcard-actions">
            <button class="btn-primary btn-review" id="flashStartReview">今日复习</button>
            <button class="btn-primary" id="flashStartLearned">只看未学的</button>
            <button class="btn-outline" id="flashShuffle">随机顺序</button>
          </div>
        </div>
      </section>

      <!-- 选择题测验视图 -->
      <section class="view view-quiz" id="view-quiz">
        <div class="quiz-panel">
          <div class="quiz-header">
            <div class="quiz-progress">
              第 <span id="quizIndex">1</span> / <span id="quizTotal">10</span> 题
            </div>
            <div class="quiz-score">
              得分：<span id="quizScore">0</span>
            </div>
          </div>
          <div class="quiz-question" id="quizStart">
            <div class="quiz-start-card">
              <h2>选择题测验</h2>
              <p>看英文选中文释义，每题 4 个选项</p>
              <button class="btn-primary big" id="quizStartBtn">开始测验</button>
            </div>
          </div>
          <div class="quiz-body" id="quizBody" style="display:none;">
            <div class="quiz-word-box">
              <span class="quiz-word" id="quizWord"></span>
              <span class="quiz-phonetic" id="quizPhonetic"></span>
            </div>
            <div class="quiz-options" id="quizOptions"></div>
            <div class="quiz-feedback" id="quizFeedback"></div>
            <div class="quiz-nav">
              <button class="btn-primary" id="quizNextBtn" style="display:none;">下一题</button>
            </div>
          </div>
          <div class="quiz-result" id="quizResult" style="display:none;">
            <h2>测验完成！</h2>
            <div class="result-score" id="resultScore"></div>
            <p class="result-comment" id="resultComment"></p>
            <button class="btn-primary big" id="quizRestartBtn">再测一次</button>
          </div>
        </div>
      </section>

      <!-- 拼写测试视图 -->
      <section class="view view-spell" id="view-spell">
        <div class="spell-panel">
          <div class="quiz-header">
            <div class="quiz-progress">
              第 <span id="spellIndex">1</span> / <span id="spellTotal">10</span> 题
            </div>
            <div class="quiz-score">
              正确：<span id="spellScore">0</span>
            </div>
          </div>
          <div class="quiz-question" id="spellStart">
            <div class="quiz-start-card">
              <h2>拼写测试</h2>
              <p>看中文释义拼写英文单词</p>
              <button class="btn-primary big" id="spellStartBtn">开始拼写</button>
            </div>
          </div>
          <div class="quiz-body" id="spellBody" style="display:none;">
            <div class="spell-meaning-box">
              <span class="spell-meaning" id="spellMeaning"></span>
              <span class="spell-pos" id="spellPos"></span>
            </div>
            <div class="spell-hint" id="spellHint">提示：—</div>
            <input type="text" class="spell-input" id="spellInput" placeholder="输入英文单词..." autocomplete="off" spellcheck="false">
            <div class="spell-controls">
              <button class="btn-outline" id="spellHintBtn">提示</button>
              <button class="btn-primary" id="spellSubmitBtn">确认</button>
            </div>
            <div class="spell-feedback" id="spellFeedback"></div>
            <div class="spell-nav">
              <button class="btn-primary" id="spellNextBtn" style="display:none;">下一个</button>
            </div>
          </div>
          <div class="quiz-result" id="spellResult" style="display:none;">
            <h2>拼写完成！</h2>
            <div class="result-score" id="spellResultScore"></div>
            <p class="result-comment" id="spellResultComment"></p>
            <button class="btn-primary big" id="spellRestartBtn">再测一次</button>
          </div>
        </div>
      </section>

      <!-- 统计视图 -->
      <section class="view view-stats" id="view-stats">
        <div class="stats-panel">
          <h2 class="stats-title">学习统计</h2>
          <div class="stats-cards" id="statsCards"></div>
          <h3 class="stats-subtitle">各年级进度</h3>
          <div class="grade-progress" id="gradeProgress"></div>
          <h3 class="stats-subtitle">学习记录</h3>
          <div class="history-log" id="historyLog"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 单词详情弹窗 -->
  <div class="modal" id="wordModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 提示 -->
  <div class="toast" id="toast"></div>

  <!-- PWA 安装提示横幅 -->
  <div class="pwa-install-banner" id="pwaInstallBanner" style="display:none;">
    <div class="pwa-banner-content">
      <span class="pwa-banner-icon">📱</span>
      <div class="pwa-banner-text">
        <strong>安装到手机桌面</strong>
        <span>离线使用，像APP一样体验</span>
      </div>
    </div>
    <div class="pwa-banner-actions">
      <button class="pwa-btn-dismiss" id="pwaDismiss">稍后</button>
      <button class="pwa-btn-install" id="pwaInstall">安装</button>
    </div>
  </div>

  <script src="words_junior.js?v=8"></script>
  <script src="words_senior.js?v=8"></script>
  <script src="app.js?v=8"></script>
  <script>
    // ===== Service Worker 注册 =====
    if ('serviceWorker' in navigator) {
      // 记录页面加载时是否已有 Service Worker 控制：用于区分"首次安装"与"版本更新"
      var hadController = !!navigator.serviceWorker.controller;
      var reloading = false;
      // 新版本 Service Worker 接管后，自动刷新一次，立即加载最新页面
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!hadController || reloading) return;
        reloading = true;
        window.location.reload();
      });
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('Service Worker 注册成功，作用域:', reg.scope);
            // 主动检查更新，发现新版本时触发安装
            reg.update && reg.update();
          })
          .catch(function(err) {
            console.log('Service Worker 注册失败:', err);
          });
      });
    }

    // ===== PWA 安装提示 =====
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      // 显示安装横幅
      var banner = document.getElementById('pwaInstallBanner');
      if (banner && sessionStorage.getItem('pwa_dismissed') !== '1') {
        banner.style.display = 'flex';
      }
    });

    document.getElementById('pwaInstall').addEventListener('click', function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choice) {
        if (choice.outcome === 'accepted') {
          console.log('用户接受了安装');
        }
        deferredPrompt = null;
        document.getElementById('pwaInstallBanner').style.display = 'none';
      });
    });

    document.getElementById('pwaDismiss').addEventListener('click', function() {
      document.getElementById('pwaInstallBanner').style.display = 'none';
      sessionStorage.setItem('pwa_dismissed', '1');
    });

    // 已安装后隐藏横幅
    window.addEventListener('appinstalled', function() {
      document.getElementById('pwaInstallBanner').style.display = 'none';
      console.log('应用已安装');
    });
  </script>
</body>
</html>
